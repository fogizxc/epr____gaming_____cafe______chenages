services:
  - type: web
    name: bytes-brew-gaming-cafe-epr
    runtime: docker
    plan: starter
    branch: production-hardening
    autoDeploy: true
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: NODE_ENV
        value: production
      - key: BUSINESS_TIMEZONE
        value: Asia/Kolkata
      - key: BOOKING_CHECKIN_GRACE_MINUTES
        value: "15"
      - key: BOOKING_NO_SHOW_GRACE_MINUTES
        value: "15"
      - key: FNB_PAYMENT_EXPIRY_MINUTES
        value: "15"
      - key: FNB_LIFECYCLE_INTERVAL_MS
        value: "30000"
      - key: MONGODB_DB_NAME
        value: bytes_brew_epr
      - key: MONGODB_APP_NAME
        value: gaming-cafe-epr
      - key: MONGODB_MAX_POOL_SIZE
        value: "30"
      - key: MONGODB_MIN_POOL_SIZE
        value: "2"
      - key: MONGODB_MAX_IDLE_TIME_MS
        value: "60000"
      - key: MONGODB_SERVER_SELECTION_TIMEOUT_MS
        value: "5000"
      - key: MONGODB_CONNECT_TIMEOUT_MS
        value: "5000"
      - key: MONGODB_SOCKET_TIMEOUT_MS
        value: "20000"
      - key: MONGODB_WAIT_QUEUE_TIMEOUT_MS
        value: "10000"
      - key: TRUST_PROXY
        value: "false"
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX_REQUESTS
        value: "120"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        sync: false
      - key: ADMIN_BOOTSTRAP_EMAIL
        sync: false
      - key: ADMIN_BOOTSTRAP_PASSWORD
        sync: false
      - key: ADMIN_BOOTSTRAP_NAME
        value: Bytes & Brew Administrator
      - key: ADMIN_BOOTSTRAP_STAFF_CODE
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        sync: false
      - key: BREVO_FROM_NAME
        value: Bytes & Brew Gaming Café
      - key: GOOGLE_SHEETS_WEBHOOK_URL
        sync: false
      - key: GOOGLE_SHEETS_SPREADSHEET_ID
        sync: false
      - key: GOOGLE_SHEETS_WEBHOOK_SECRET
        sync: false
      - key: GOOGLE_FORMS_WEBHOOK_SECRET
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
