name: one-time-hardening
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ !contains(github.event.head_commit.message, '[hardening-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden runtime arrays
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/CafeContext.tsx')
          s=p.read_text()
          old="function loadFromStorage<T>(key: string, fallback: T): T { try { const item = localStorage.getItem(STORAGE_KEY_PREFIX + key); return item ? JSON.parse(item) : fallback; } catch { return fallback; } }"
          new="function loadFromStorage<T>(key: string, fallback: T): T { try { const item = localStorage.getItem(STORAGE_KEY_PREFIX + key); if (!item) return fallback; const parsed = JSON.parse(item); if (Array.isArray(fallback)) return (Array.isArray(parsed) ? parsed : fallback) as T; if (fallback && typeof fallback === 'object' && (parsed === null || typeof parsed !== 'object')) return fallback; return parsed ?? fallback; } catch { return fallback; } }"
          if old not in s: raise SystemExit('loadFromStorage pattern not found')
          p.write_text(s.replace(old,new))
          PY
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add src/context/CafeContext.tsx
          git diff --cached --quiet || git commit -m 'fix: harden all persisted context arrays [hardening-complete]'
          git push
