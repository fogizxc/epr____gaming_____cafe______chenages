name: Production checks

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --replSet rs0
          --health-cmd "mongosh --quiet --eval 'try { rs.status().ok } catch(e) { 1 }'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/bytes_brew_epr_test?replicaSet=rs0
      MONGODB_DB_NAME: bytes_brew_epr_test
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/bytes_brew_epr_test?replicaSet=rs0
      MONGODB_TEST_DB_NAME: bytes_brew_epr_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Initialize MongoDB replica set
        shell: bash
        run: |
          docker exec $(docker ps -q --filter ancestor=mongo:7 | head -1) mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do docker exec $(docker ps -q --filter ancestor=mongo:7 | head -1) mongosh --quiet --eval 'try { rs.status().myState === 1 ? quit(0) : quit(1) } catch(e) { quit(1) }' && break; sleep 1; done
      - name: Install
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Security contract tests
        run: npm run test:security
      - name: Production contract tests
        run: npm run test:production
      - name: MongoDB integration tests
        run: npm run test:mongodb
      - name: Production build
        run: npm run build
