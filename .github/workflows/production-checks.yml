name: Production checks

on:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/bytes_brew_epr_test
      MONGODB_DB_NAME: bytes_brew_epr_test
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/bytes_brew_epr_test
      MONGODB_TEST_DB_NAME: bytes_brew_epr_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Type check
        run: npm run lint
      - name: Production contract tests
        run: npm run test:production
      - name: MongoDB integration tests
        run: npm run test:mongodb
      - name: Production build
        run: npm run build
