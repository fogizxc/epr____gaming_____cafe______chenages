name: Production checks

on:
  workflow_dispatch:
  push:
    branches: [main, production-hardening]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MONGODB_URI: mongodb://127.0.0.1:27017/bytes_brew_epr_test?replicaSet=rs0
      MONGODB_DB_NAME: bytes_brew_epr_test
      MONGODB_TEST_URI: mongodb://127.0.0.1:27017/bytes_brew_epr_test?replicaSet=rs0
      MONGODB_TEST_DB_NAME: bytes_brew_epr_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Start MongoDB replica set
        shell: bash
        run: |
          docker run -d --name cafe-mongodb -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in {1..30}; do docker exec cafe-mongodb mongosh --quiet --eval 'try { db.adminCommand({ping:1}).ok === 1 ? quit(0) : quit(1) } catch(e) { quit(1) }' && break; sleep 1; done
          docker exec cafe-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in {1..30}; do docker exec cafe-mongodb mongosh --quiet --eval 'try { rs.status().myState === 1 ? quit(0) : quit(1) } catch(e) { quit(1) }' && break; sleep 1; done
      - name: Install
        run: npm install
      - name: Repository production audit
        run: npm run audit:production
      - name: Type check
        run: npm run lint
      - name: Security contract tests
        run: npm run test:security
      - name: Production contract tests
        run: npm run test:production
      - name: MongoDB integration tests
        run: npm run test:mongodb
      - name: Production build
        run: npm run build
      - name: Stop MongoDB
        if: always()
        run: docker rm -f cafe-mongodb || true
